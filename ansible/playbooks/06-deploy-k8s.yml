---
# ============================================================
# 플레이북: 06-deploy-k8s.yml
# 상태: ⚠️  DEPRECATED — ArgoCD 도입으로 역할 종료
#
# 이전 역할:
#   k8s/*.yaml (Jinja2 템플릿)을 렌더링하여 kubectl apply로 직접 배포.
#   aws_account_id, nat_ip 변수를 IMDS에서 동적 획득하여 이미지 태그 주입.
#
# 변경 이유:
#   Kustomize 전환으로 k8s/base/, k8s/overlays/ 구조가 도입되어
#   Jinja2 변수가 제거됐고, 이미지 태그는 kustomization.yaml의 images: 블록으로 관리.
#   ArgoCD가 microlens-infra 레포를 감시하여 클러스터에 자동 동기화하므로
#   Ansible이 직접 kubectl apply를 실행할 필요가 없어짐.
#   직접 kubectl apply를 실행하면 ArgoCD의 selfHeal이 원래 상태로 되돌려
#   충돌이 발생함.
#
# 현재 배포 흐름:
#   Jenkins → kustomize edit set image → git push (microlens-infra)
#     → ArgoCD 변경 감지 → kubectl apply -k k8s/overlays/phase2
#
# 이 플레이북은 site.yml에서 제거해도 무방하나,
# 이력 보존 목적으로 파일만 유지함.
# ============================================================
- name: "[DEPRECATED] 06-deploy-k8s — ArgoCD로 대체됨"
  hosts: masters
  gather_facts: false
  tags: [k8s-deploy]

  tasks:
    - name: 역할 종료 안내
      ansible.builtin.debug:
        msg:
          - "이 플레이북은 ArgoCD 도입으로 더 이상 사용되지 않습니다."
          - "배포는 ArgoCD가 microlens-infra 레포를 감시하여 자동 처리합니다."
          - "이미지 태그 갱신: Jenkins → kustomize edit set image → git push"
          - "ArgoCD 상태 확인: kubectl get applications -n argocd"
