---
# ============================================================
# 플레이북: 07-jenkins.yml
# 대상: jenkins 그룹 (퍼블릭 서브넷 EC2, t3.medium)
# 레이어: CI 레이어 - Jenkins 서버 초기 설정
#
# 목적:
#   GitHub Webhook을 수신하여 Docker 이미지를 빌드하고
#   ECR에 푸시한 뒤 배포 레포(microlens-infra)의 Kustomize
#   이미지 태그를 갱신하는 CI 서버를 구성한다.
#
# 설치 항목:
#   - Java 17 LTS       : Jenkins 런타임
#   - Jenkins LTS       : CI 서버 (포트 8080)
#   - Docker CE         : 이미지 빌드
#   - AWS CLI v2        : ECR 인증 (aws ecr get-login-password)
#   - kubectl           : K8s 클러스터 상태 확인용
#   - kustomize         : overlays/production 이미지 태그 갱신
#   - git               : 배포 레포 클론/푸시
#
# 실행:
#   ansible-playbook playbooks/07-jenkins.yml --tags jenkins
#   ansible-playbook site.yml --tags jenkins
# ============================================================
- name: Jenkins CI server setup
  hosts: jenkins
  become: true
  tags: jenkins

  handlers:
    - name: restart jenkins
      systemd:
        name: jenkins
        state: restarted
        daemon_reload: true

    - name: restart docker
      systemd:
        name: docker
        state: restarted
        daemon_reload: true

  tasks:
    # ── apt 사전 패키지 ────────────────────────────────────
    - name: Install apt prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - unzip
          - git
        state: present
        update_cache: true

    # ── Java 17 ───────────────────────────────────────────
    # Jenkins LTS 2.x는 Java 11+를 요구하고, 17 LTS를 권장한다.
    - name: Install Java 17 LTS
      apt:
        name: openjdk-17-jdk-headless
        state: present
        update_cache: true

    - name: Set JAVA_HOME system-wide
      copy:
        dest: /etc/profile.d/java.sh
        content: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH

    # ── Jenkins LTS ───────────────────────────────────────
    # Jenkins 공식 Debian 저장소 추가
    # gpg --dearmor 방식은 Ubuntu 22.04에서 키 검증 실패가 발생할 수 있음.
    # Jenkins 공식 문서 권장: ASCII armored (.asc) 형식으로 직접 저장.
    - name: Add Jenkins GPG key (ASCII armored)
      # creates 생략: 키 URL이 바뀌어도 항상 최신 키를 받도록 한다.
      # creates를 쓰면 구버전 키 파일이 있을 때 스킵되어 NO_PUBKEY 오류가 발생한다.
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: "0644"
        force: true

    - name: Add Jenkins apt repository
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: |
          deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/

    - name: Install Jenkins LTS
      apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Enable and start Jenkins
      systemd:
        name: jenkins
        enabled: true
        state: started

    # ── Docker CE ─────────────────────────────────────────
    # Jenkins가 Docker 이미지를 빌드하기 위한 Docker 데몬.
    # containerd.io는 K8s 노드 전용이므로 Jenkins 서버에는
    # docker-ce 전체 패키지를 설치한다.
    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker CE GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker CE apt repository
      shell: |
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] \
          https://download.docker.com/linux/ubuntu \
          $(lsb_release -cs) stable" \
          > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker CE
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    # jenkins 사용자가 sudo 없이 docker 명령을 실행하려면
    # docker 그룹에 포함되어야 한다.
    - name: Add jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: true
      notify: restart jenkins

    # ── AWS CLI v2 ────────────────────────────────────────
    # ECR 인증에 사용: aws ecr get-login-password | docker login
    # Jenkins EC2는 IAM Role(jenkins-role)을 통해 ECR PowerUser 권한을 갖는다.
    - name: Check AWS CLI version
      command: aws --version
      register: awscli_check
      ignore_errors: true
      changed_when: false

    - name: Download AWS CLI v2 installer
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
      when: awscli_check.rc != 0 or 'aws-cli/2' not in (awscli_check.stdout + awscli_check.stderr)

    - name: Unzip AWS CLI v2 installer
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp/
        remote_src: true
      when: awscli_check.rc != 0 or 'aws-cli/2' not in (awscli_check.stdout + awscli_check.stderr)

    - name: Install AWS CLI v2
      command: /tmp/aws/install --update
      when: awscli_check.rc != 0 or 'aws-cli/2' not in (awscli_check.stdout + awscli_check.stderr)

    # ── kubectl ───────────────────────────────────────────
    # K8s 클러스터 상태 확인 및 매니페스트 검증용.
    # 실제 배포는 Argo CD가 담당하므로 파이프라인에서 apply는 하지 않는다.
    - name: Add Kubernetes GPG key
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key \
          | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /

    - name: Install kubectl
      apt:
        name: kubectl
        state: present
        update_cache: true

    # ── kustomize ─────────────────────────────────────────
    # Jenkins 파이프라인에서 overlays/production/kustomization.yaml의
    # 이미지 태그를 갱신하는 데 사용:
    #   kustomize edit set image <ECR_REPO>:<NEW_TAG>
    - name: Check kustomize installed
      command: kustomize version
      register: kustomize_check
      ignore_errors: true
      changed_when: false

    - name: Download and install kustomize
      shell: |
        curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
          | bash -s -- /usr/local/bin
      when: kustomize_check.rc != 0

    # ── 버전 확인 (디버그) ────────────────────────────────
    - name: Verify installed tools
      command: "{{ item }}"
      loop:
        - java -version
        - jenkins --version
        - docker --version
        - aws --version
        - kubectl version --client
        - kustomize version
      register: version_check
      ignore_errors: true
      changed_when: false

    # ── Jenkins 관리자 비밀번호 확정 ─────────────────────────
    # group_vars/jenkins.yml의 jenkins_admin_password가 설정되어 있으면 그 값 사용.
    # 비어있으면 /var/lib/jenkins/secrets/initialAdminPassword 파일에서 읽는다.
    # (최초 설치 직후에만 파일이 존재하며, 이후엔 group_vars 값을 직접 입력해야 함)
    - name: Read initial password from file (jenkins_admin_password 미설정 시)
      command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_password_file
      changed_when: false
      failed_when: false
      when: jenkins_admin_password == ""

    - name: Set jenkins_admin_password from file (최초 설치 시)
      set_fact:
        jenkins_admin_password: "{{ jenkins_password_file.stdout }}"
      when: jenkins_admin_password == "" and jenkins_password_file.stdout is defined and jenkins_password_file.stdout != ""

    - name: Verify jenkins_admin_password is set
      fail:
        msg: |
          jenkins_admin_password가 설정되지 않았습니다.
          ansible/inventory/group_vars/jenkins.yml 에 비밀번호를 입력하세요:
            jenkins_admin_password: "your-password"
      when: jenkins_admin_password == ""

    - name: Show Jenkins credentials
      debug:
        msg:
          - "Jenkins admin user     : {{ jenkins_admin_user }}"
          - "Jenkins admin password : {{ jenkins_admin_password }}"

    # ── Setup Wizard 자동 건너뛰기 ──────────────────────────
    # Jenkins 최초 기동 시 Setup Wizard(초기 설정 화면)가 표시된다.
    # UpgradeWizard.state 파일에 "2.0"을 기록하면
    # Wizard 없이 바로 운영 상태로 진입하여 API 호출이 가능해진다.
    - name: Skip Jenkins setup wizard
      copy:
        dest: /var/lib/jenkins/jenkins.install.UpgradeWizard.state
        content: "2.0"
        owner: jenkins
        group: jenkins
        mode: "0644"
      register: wizard_state

    - name: Restart Jenkins to apply wizard skip
      systemd:
        name: jenkins
        state: restarted
      when: wizard_state.changed

    # XML 파일 직접 수정 방식은 재시작 타이밍에 따라 CLI가 URL을 인식 못하는 문제가 있다.
    # init.groovy.d 스크립트는 Jenkins 기동 시 반드시 실행되므로 더 안정적이다.
    - name: Ensure init.groovy.d directory exists
      file:
        path: /var/lib/jenkins/init.groovy.d
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    # EC2 메타데이터에서 퍼블릭 IP(EIP) 조회
    - name: Get public IP from EC2 metadata
      uri:
        url: http://169.254.169.254/latest/meta-data/public-ipv4
        return_content: true
      register: ec2_public_ip
      changed_when: false

    - name: Set Jenkins URL via init groovy script
      copy:
        dest: /var/lib/jenkins/init.groovy.d/set-jenkins-url.groovy
        content: |
          import jenkins.model.*
          JenkinsLocationConfiguration.get().setUrl("http://{{ ec2_public_ip.content }}:8080/")
          JenkinsLocationConfiguration.get().save()
        owner: jenkins
        group: jenkins
        mode: "0644"
      notify: restart jenkins

    - name: Flush handlers (Jenkins URL 설정 후 재시작 적용)
      meta: flush_handlers

    # Jenkins가 재시작 완료되어 API를 받을 준비가 될 때까지 대기
    - name: Wait for Jenkins to be fully operational
      uri:
        url: "http://localhost:8080/login"
        status_code: 200
      register: jenkins_ready
      until: jenkins_ready.status == 200
      retries: 18
      delay: 10

    # ── 필수 플러그인 설치 ──────────────────────────────────
    # Jenkins CLI로 필수 플러그인을 설치한다.
    # ssh-credentials : GitHub Deploy Key(SSH 개인키) Credential 타입 제공
    # git             : Pipeline에서 git checkout 지원
    # workflow-aggregator : Pipeline(Jenkinsfile) 실행 엔진
    - name: Download Jenkins CLI jar
      get_url:
        url: "http://localhost:8080/jnlpJars/jenkins-cli.jar"
        dest: /tmp/jenkins-cli.jar
        force: true

    - name: Check installed Jenkins plugins
      command: >
        java -jar /tmp/jenkins-cli.jar
        -s http://{{ ec2_public_ip.content }}:8080
        -auth {{ jenkins_admin_user }}:{{ jenkins_admin_password }}
        list-plugins
      register: installed_plugins
      changed_when: false
      failed_when: false

    - name: Install required Jenkins plugins
      command: >
        java -jar /tmp/jenkins-cli.jar
        -s http://{{ ec2_public_ip.content }}:8080
        -auth {{ jenkins_admin_user }}:{{ jenkins_admin_password }}
        install-plugin ssh-credentials git github workflow-aggregator -restart
      register: plugin_install
      changed_when: plugin_install.rc == 0
      failed_when: plugin_install.rc != 0
      when: >
        'ssh-credentials' not in installed_plugins.stdout or
        'git ' not in installed_plugins.stdout or
        'github ' not in installed_plugins.stdout or
        'workflow-aggregator' not in installed_plugins.stdout

    # 플러그인 설치 후 Jenkins가 재시작되므로 다시 대기
    # port: 8080 오픈은 Jenkins 내부 초기화 완료를 보장하지 않는다.
    # /login 이 200을 반환할 때까지 반복 확인하여 완전한 준비 상태를 보장한다.
    - name: Wait for Jenkins to be fully ready after plugin installation
      uri:
        url: "http://localhost:8080/login"
        status_code: 200
        validate_certs: false
      register: jenkins_login_ready
      until: jenkins_login_ready.status == 200
      retries: 24
      delay: 10
      when: plugin_install.changed | default(false)

    # ── GitHub PAT Jenkins Credentials 등록 ─────────────────
    # 조직 정책으로 SSH Deploy Key가 차단된 경우 PAT(Personal Access Token)으로 대체.
    # PAT는 HTTPS git 인증에 사용되며, Jenkinsfile의 git clone/push URL도
    # ssh → https 방식으로 변경해야 한다.
    #
    # 사전 준비:
    #   github.com → Settings → Developer settings → Personal access tokens
    #   → Generate new token (classic) → repo 스코프 체크 → 생성
    #   → inventory/group_vars/jenkins.yml 의 github_pat 에 입력
    #
    # Jenkins 2.x CSRF 보호: 크럼(Crumb) + 세션 쿠키(JSESSIONID)를 함께 전송.
    - name: Get Jenkins CSRF crumb
      uri:
        url: "http://localhost:8080/crumbIssuer/api/json"
        method: GET
        user: "{{ jenkins_admin_user }}"
        password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      register: crumb_response
      until: crumb_response.status == 200
      retries: 12
      delay: 10
      no_log: true

    # 크럼 응답의 set_cookie에서 JSESSIONID 값만 추출 (';' 이후 옵션 제거)
    - name: Extract session cookie from crumb response
      set_fact:
        jenkins_session_cookie: "{{ crumb_response.set_cookie.split(';')[0] }}"

    # 멱등성 보장: 이미 등록된 경우 재등록하지 않는다 (404면 미등록 상태)
    - name: Check if GitHub PAT credential already exists
      uri:
        url: "http://localhost:8080/credentials/store/system/domain/_/credential/github-pat/api/json"
        method: GET
        user: "{{ jenkins_admin_user }}"
        password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        status_code: [200, 404]
      register: cred_check
      failed_when: false

    # UsernamePasswordCredentialsImpl: HTTPS git 인증용 PAT 등록
    # username: GitHub 사용자명 또는 org명 (HTTPS URL의 인증 주체)
    # password: PAT 토큰 값 (repo 스코프 필요)
    - name: Register GitHub PAT in Jenkins Credentials
      uri:
        url: "http://localhost:8080/credentials/store/system/domain/_/createCredentials"
        method: POST
        user: "{{ jenkins_admin_user }}"
        password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        headers:
          Jenkins-Crumb: "{{ (crumb_response.content | from_json).crumb }}"
          Cookie: "{{ jenkins_session_cookie }}"
        body_format: form-urlencoded
        body:
          json: "{{ credential_payload | to_json }}"
        status_code: [200, 302]
      no_log: false
      vars:
        credential_payload:
          "": "0"
          credentials:
            scope: GLOBAL
            id: github-pat
            description: "GitHub PAT for microlens-infra HTTPS push (auto-registered by Ansible)"
            username: "{{ github_username }}"
            password: "{{ github_pat }}"
            stapler-class: "com.cloudbees.plugins.credentials.impl.UsernamePasswordCredentialsImpl"
            "$class": "com.cloudbees.plugins.credentials.impl.UsernamePasswordCredentialsImpl"
      when: cred_check is defined and cred_check.status | default(0) == 404

