---
# ============================================================
# 플레이북: 05-addons.yml
# 대상: masters 그룹 (kubectl 실행 위치)
# 레이어: 애플리케이션 레이어 - K8s 클러스터 확장 컴포넌트
#
# 목적:
#   클러스터 기본 기능을 확장하는 애드온(K8s 공식 용어)을 배포한다.
#   01~04가 "클러스터를 만드는" 작업이라면,
#   05는 "클러스터를 쓸 수 있게 만드는" 작업이다.
#
# 01~04와의 레이어 구분:
#   01~04: OS/드라이버/kubeadm 수준 → apt install, kubeadm 명령
#   05:    K8s 수준 → kubectl apply (클러스터가 존재해야 실행 가능)
#
#   nvidia-device-plugin이 02-gpu가 아닌 여기에 있는 이유:
#     DaemonSet은 kubectl apply로 배포하며 클러스터가 필요하다.
#     02-gpu 실행 시점에는 아직 클러스터가 없으므로(03에서 init)
#     반드시 04-worker join 이후인 이 플레이북에서 배포해야 한다.
#
# 실행 순서상 위치:
#   01-common → 02-gpu → 03-master → 04-worker → [05-addons]
#   모든 노드가 클러스터에 합류한 이후 마지막에 실행한다.
# ============================================================
- name: Install cluster addons
  hosts: masters
  become: false   # ubuntu 계정의 kubeconfig로 kubectl 실행
  tags: addons

  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

  tasks:
    # ── Metrics Server ─────────────────────────────────────
    # HPA(Horizontal Pod Autoscaler)가 CPU/메모리 사용량을 수집하려면
    # Metrics Server가 먼저 설치되어 있어야 한다.
    # Metrics Server 없이 HPA를 적용하면 "unable to get metrics" 오류가 발생하고
    # Pod가 자동 확장되지 않는다.
    - name: Install Metrics Server
      command: >
        kubectl apply -f
        https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

    # ── Nginx Ingress Controller ───────────────────────────
    # 외부 트래픽의 단일 진입점으로, L7(HTTP) 경로 기반 라우팅을 담당한다.
    # /stain/detect, /stain/classify, /teeth/check 경로를
    # 각각 다른 Service로 분기하는 04-ingress.yaml이 이 컨트롤러를 필요로 한다.
    #
    # baremetal 버전을 사용하는 이유:
    #   EKS/GKE 등 관리형 K8s는 클라우드 로드밸런서와 자동 연동되지만,
    #   kubeadm으로 직접 구성한 클러스터는 클라우드 LB 연동이 없다.
    #   baremetal 버전은 NodePort로 노출되어 이 환경에서 정상 동작한다.
    - name: Install Nginx Ingress Controller (baremetal)
      command: >
        kubectl apply -f
        https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.0/deploy/static/provider/baremetal/deploy.yaml

    # ── 기존 GPU Taint 제거 ─────────────────────────────────
    # Taint 전략에서 Label/NodeSelector 전략으로 전환하면서
    # 이전에 걸린 dedicated=gpu:NoSchedule taint를 제거한다.
    # taint가 없는 노드에 실행하면 오류가 나므로 ignore_errors로 멱등성 보장.
    - name: Remove GPU taint from worker nodes (if exists)
      shell: |
        for node in $(kubectl get nodes \
          --selector='!node-role.kubernetes.io/control-plane' \
          -o jsonpath='{.items[*].metadata.name}'); do
          kubectl taint node "$node" dedicated=gpu:NoSchedule- 2>/dev/null || true
        done
      when: gpu_enabled | bool

    # ── GPU 워커 노드 라벨링 ────────────────────────────────
    # Taint 대신 Label + NodeSelector 전략을 사용한다.
    #
    # 이유:
    #   nvidia.com/gpu: 1 resource limit만으로도 GPU Pod는 GPU 노드에만 배치된다.
    #   (GPU 자원이 없는 노드에는 스케줄러가 자동으로 배치하지 않음)
    #   Taint를 걸면 ingress-nginx, metrics-server 등 시스템 Pod까지 모두 Pending이
    #   되어 모든 컴포넌트에 toleration을 추가해야 하는 관리 오버헤드가 생긴다.
    #
    # 동작 원리:
    #   워커 노드에 node-type=gpu 라벨을 부여하고,
    #   GPU 서비스 Pod(stain-detection, teeth)의 nodeSelector에 node-type: gpu를
    #   명시하여 GPU 노드로 유도한다.
    #   시스템 Pod들은 nodeSelector가 없으므로 CPU 여유가 있는 워커 노드에 자유롭게 배치된다.
    - name: Label GPU worker nodes (node-type=gpu)
      shell: |
        for node in $(kubectl get nodes \
          --selector='!node-role.kubernetes.io/control-plane' \
          -o jsonpath='{.items[*].metadata.name}'); do
          kubectl label node "$node" node-type=gpu --overwrite
        done
      when: gpu_enabled | bool

    # ── nvidia-device-plugin (GPU only) ───────────────────
    # 역할: K8s 스케줄러가 각 노드의 GPU 수를 자원으로 인식하게 만드는 DaemonSet.
    #       이것이 없으면 Pod spec에 nvidia.com/gpu: 1을 선언해도
    #       스케줄러가 "GPU 자원 없음"으로 판단하여 Pending 상태가 된다.
    #
    # 동작 원리:
    #   DaemonSet이 각 노드에서 실행되어 nvidia-smi로 GPU 수를 감지하고
    #   노드의 status.allocatable에 nvidia.com/gpu: 1을 등록한다.
    #   이후 스케줄러가 이 정보를 보고 GPU Pod를 해당 노드에 배치한다.
    #
    # gpu_enabled: false(t3.medium 단계)에서는 이 태스크가 스킵되어
    # GPU 없는 환경에서도 플레이북이 오류 없이 완료된다.
    - name: Install nvidia-device-plugin
      command: >
        kubectl apply -f
        https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.14.5/nvidia-device-plugin.yml
      when: gpu_enabled | bool
