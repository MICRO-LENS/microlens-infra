---
# ============================================================
# 플레이북: 05-addons.yml
# 대상: masters 그룹 (kubectl 실행 위치)
# 레이어: 애플리케이션 레이어 - K8s 클러스터 확장 컴포넌트
#
# 목적:
#   클러스터 기본 기능을 확장하는 애드온(K8s 공식 용어)을 배포한다.
#   01~04가 "클러스터를 만드는" 작업이라면,
#   05는 "클러스터를 쓸 수 있게 만드는" 작업이다.
#
# 01~04와의 레이어 구분:
#   01~04: OS/드라이버/kubeadm 수준 → apt install, kubeadm 명령
#   05:    K8s 수준 → kubectl apply (클러스터가 존재해야 실행 가능)
#
#   nvidia-device-plugin이 02-gpu가 아닌 여기에 있는 이유:
#     DaemonSet은 kubectl apply로 배포하며 클러스터가 필요하다.
#     02-gpu 실행 시점에는 아직 클러스터가 없으므로(03에서 init)
#     반드시 04-worker join 이후인 이 플레이북에서 배포해야 한다.
#
# 실행 순서상 위치:
#   01-common → 02-gpu → 03-master → 04-worker → [05-addons]
#   모든 노드가 클러스터에 합류한 이후 마지막에 실행한다.
# ============================================================
- name: Install cluster addons
  hosts: masters
  become: false   # ubuntu 계정의 kubeconfig로 kubectl 실행
  tags: addons

  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

  tasks:
    # ── Metrics Server ─────────────────────────────────────
    # HPA(Horizontal Pod Autoscaler)가 CPU/메모리 사용량을 수집하려면
    # Metrics Server가 먼저 설치되어 있어야 한다.
    # Metrics Server 없이 HPA를 적용하면 "unable to get metrics" 오류가 발생하고
    # Pod가 자동 확장되지 않는다.
    - name: Install Metrics Server
      command: >
        kubectl apply -f
        https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

    # kubeadm 클러스터는 kubelet이 자체 서명 인증서를 사용하므로
    # metrics-server가 kubelet API 접근 시 인증서 검증에 실패한다.
    # --kubelet-insecure-tls 플래그로 검증을 건너뛰어야 kubectl top이 동작한다.
    - name: Patch Metrics Server to skip kubelet TLS verification
      command: >
        kubectl patch deployment metrics-server -n kube-system
        --type=json
        -p=[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]

    # ── Nginx Ingress Controller ───────────────────────────
    # 외부 트래픽의 단일 진입점으로, L7(HTTP) 경로 기반 라우팅을 담당한다.
    # /stain/detect, /stain/classify, /teeth/check 경로를
    # 각각 다른 Service로 분기하는 04-ingress.yaml이 이 컨트롤러를 필요로 한다.
    #
    # baremetal 버전을 사용하는 이유:
    #   EKS/GKE 등 관리형 K8s는 클라우드 로드밸런서와 자동 연동되지만,
    #   kubeadm으로 직접 구성한 클러스터는 클라우드 LB 연동이 없다.
    #   baremetal 버전은 NodePort로 노출되어 이 환경에서 정상 동작한다.
    - name: Install Nginx Ingress Controller (baremetal)
      command: >
        kubectl apply -f
        https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.0/deploy/static/provider/baremetal/deploy.yaml

    # ── Nginx Ingress NodePort 고정 ─────────────────────────
    # ALB Target Group이 고정 포트(30080)를 바라보기 때문에
    # NodePort를 랜덤 값에서 30080으로 패치한다.
    # baremetal 매니페스트 기준으로 ports[0] = http(80), ports[1] = https(443)
    - name: Wait for ingress-nginx-controller service
      command: kubectl get svc ingress-nginx-controller -n ingress-nginx
      register: ingress_svc
      until: ingress_svc.rc == 0
      retries: 12
      delay: 10
      changed_when: false

    - name: Fix Nginx Ingress HTTP NodePort to 30080
      command: >
        kubectl patch svc ingress-nginx-controller -n ingress-nginx
        --type=json
        -p=[{"op":"replace","path":"/spec/ports/0/nodePort","value":30080}]
      changed_when: true

    # ── GPU 워커 노드 라벨 + Taint ──────────────────────────
    # 전략: CPU 워커 노드가 추가되었으므로 Taint 전략을 적용한다.
    #
    # GPU 노드에 Taint(dedicated=gpu:NoSchedule)를 걸고
    # GPU 서비스 Pod(stain-detection, teeth)에만 Toleration을 추가한다.
    # 시스템 Pod(ingress-nginx, metrics-server)와 CPU 서비스(stain-classification)는
    # Toleration이 없으므로 자동으로 CPU 워커 노드에 배치된다.
    #
    # 노드 식별 방법:
    #   Ansible 인벤토리의 ansible_host(프라이빗 IP)로
    #   kubectl get nodes -o wide의 INTERNAL-IP 컬럼을 매칭하여 노드명을 찾는다.
    #   kubeadm 클러스터에서 노드명은 호스트명이며 IP와 1:1 매핑된다.
    - name: Label and taint GPU worker nodes (node-type=gpu, role=gpu-worker, dedicated=gpu:NoSchedule)
      shell: |
        node=$(kubectl get nodes -o wide | awk '$6 == "{{ hostvars[item]['ansible_host'] }}" {print $1}')
        kubectl label node "$node" node-type=gpu --overwrite
        kubectl label node "$node" node-role.kubernetes.io/gpu-worker= --overwrite
        kubectl taint node "$node" dedicated=gpu:NoSchedule --overwrite
      loop: "{{ groups['gpu_workers'] }}"
      when: gpu_enabled | bool

    # ── CPU 워커 노드 라벨링 ────────────────────────────────
    # stain-classification Pod의 nodeSelector(node-type=cpu)가
    # 이 라벨을 보고 CPU 워커 노드에만 배치되도록 유도한다.
    - name: Label CPU worker nodes (node-type=cpu, role=cpu-worker)
      shell: |
        node=$(kubectl get nodes -o wide | awk '$6 == "{{ hostvars[item]['ansible_host'] }}" {print $1}')
        kubectl label node "$node" node-type=cpu --overwrite
        kubectl label node "$node" node-role.kubernetes.io/cpu-worker= --overwrite
      loop: "{{ groups['cpu_workers'] }}"

    # ── nvidia-device-plugin (GPU only) ───────────────────
    # 역할: K8s 스케줄러가 각 노드의 GPU 수를 자원으로 인식하게 만드는 DaemonSet.
    #       이것이 없으면 Pod spec에 nvidia.com/gpu: 1을 선언해도
    #       스케줄러가 "GPU 자원 없음"으로 판단하여 Pending 상태가 된다.
    #
    # 동작 원리:
    #   DaemonSet이 각 노드에서 실행되어 nvidia-smi로 GPU 수를 감지하고
    #   노드의 status.allocatable에 nvidia.com/gpu: 1을 등록한다.
    #   이후 스케줄러가 이 정보를 보고 GPU Pod를 해당 노드에 배치한다.
    #
    # gpu_enabled: false(t3.medium 단계)에서는 이 태스크가 스킵되어
    # GPU 없는 환경에서도 플레이북이 오류 없이 완료된다.
    - name: Install nvidia-device-plugin
      command: >
        kubectl apply -f
        https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.14.5/nvidia-device-plugin.yml
      when: gpu_enabled | bool
