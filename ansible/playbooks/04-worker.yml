---
# ============================================================
# 플레이북: 04-worker.yml
# 대상: workers 그룹 (Worker Node 2대)
# 레이어: 인프라 레이어 - Worker Node 클러스터 합류
#
# 목적:
#   03-master.yml에서 저장한 join 커맨드를 사용하여
#   Worker Node들을 클러스터에 합류(join)시킨다.
#   이 플레이북이 완료되면 kubectl get nodes에서 모든 노드가 조회된다.
#
# 전제 조건:
#   - 03-master.yml이 먼저 실행되어 /tmp/kubeadm_join_command 파일이 있어야 함
#   - 01-common.yml로 containerd와 kubelet이 설치되어 있어야 함
#
# 실행 순서상 위치:
#   01-common → 02-gpu → 03-master → [04-worker] → 05-addons
# ============================================================
- name: Join worker nodes to cluster
  hosts: workers
  become: true
  tags: worker

  tasks:
    # 멱등성 보장: kubelet.conf가 이미 존재하면 이미 join된 노드이므로
    # join 커맨드를 다시 실행하지 않는다.
    # 플레이북을 재실행해도 "already joined" 오류가 발생하지 않는다.
    - name: Check if node already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    # 03-master.yml이 Ansible 컨트롤러(/tmp/kubeadm_join_command)에 저장한
    # join 커맨드를 읽어 변수로 등록한다.
    # join 커맨드 형식 예시:
    #   kubeadm join 10.0.101.41:6443 --token <token> \
    #     --discovery-token-ca-cert-hash sha256:<hash>
    - name: Read join command from controller
      set_fact:
        join_cmd: "{{ lookup('file', '/tmp/kubeadm_join_command') }}"
      when: not kubelet_conf.stat.exists

    - name: Join cluster
      command: "{{ join_cmd }}"
      when: not kubelet_conf.stat.exists
