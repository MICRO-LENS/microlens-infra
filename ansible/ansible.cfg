[defaults]
inventory          = inventory/hosts.ini
private_key_file   = ~/.ssh/microlens-key.pem
remote_user        = ubuntu
host_key_checking  = False
stdout_callback    = ansible.builtin.default
result_format      = yaml
timeout            = 30

[ssh_connection]
ssh_args           = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining         = True
