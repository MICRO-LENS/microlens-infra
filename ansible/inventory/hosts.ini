# terraform output 값으로 채워주세요
# terraform output -raw nat_public_ip         → [bastion] ansible_host  ← SSH 경유지는 NAT 인스턴스
# terraform output -raw control_plane_ids     → [masters] ansible_host (private IP, AWS 콘솔 확인)
# worker private IP는 AWS 콘솔 또는 terraform show로 확인
# (jenkins_public_ip는 Webhook 전용, SSH 경유지 아님)

[bastion]
nat ansible_host=43.200.118.58 ansible_user=ubuntu

[masters]
master ansible_host=10.0.101.41 ansible_user=ubuntu

[workers]
worker-1 ansible_host=10.0.102.215 ansible_user=ubuntu
worker-2 ansible_host=10.0.102.252 ansible_user=ubuntu

[k8s:children]
masters
workers

[k8s:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -W %h:%p -i ../microlens-key.pem -o StrictHostKeyChecking=no ubuntu@43.200.118.58"'
