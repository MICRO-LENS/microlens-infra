# ============================================================
# 파일: 00-serviceaccount.yaml
# 목적: Pod가 AWS 리소스(S3, ECR)에 접근할 때 사용할 신원(Identity) 정의
#
# ServiceAccount란:
#   사람이 아닌 Pod가 API 서버나 외부 서비스에 인증할 때 사용하는 K8s 계정.
#   모든 Deployment의 spec.serviceAccountName에 이 SA를 지정한다.
#
# 현재 구성 (EC2 인스턴스 프로파일 방식):
#   Worker Node IAM Role(microlens-node-role)에 이미 S3 ReadOnly + ECR ReadOnly
#   권한이 부여되어 있으므로, 별도 annotation 없이도 Pod에서 AWS SDK가 동작한다.
#   노드 위에서 실행되는 모든 Pod가 노드의 IAM Role을 자동으로 상속받는다.
#
# 향후 EKS 전환 시 IRSA(IAM Roles for Service Accounts) 방식:
#   Pod별로 독립된 IAM Role을 부여할 수 있어 최소 권한 원칙 적용에 유리하다.
#   전환 시 아래 주석을 해제하고 실제 ARN을 입력하면 된다.
#
# ✏️  수정 불필요 (EC2 인스턴스 프로파일로 동작)
#     EKS 전환 시: eks.amazonaws.com/role-arn annotation 활성화 필요
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: microlens-sa
  namespace: microlens
  annotations:
    # [EKS 전환 시 활성화] Pod 전용 IAM Role ARN 입력
    # eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/microlens-pod-role
    #
    # 현재는 Worker Node의 EC2 인스턴스 프로파일(microlens-node-role)을 사용.
    # S3 ReadOnly + ECR ReadOnly 권한이 노드 레벨에서 이미 부여되어 있음.
