# ============================================================
# 파일: 01-stain-detection.yaml
# 목적: 얼룩 탐지 AI 서비스 배포 및 클러스터 내부 노출
# 리소스: Deployment + Service (ClusterIP)
#
# GPU 사용 여부: ✅ nvidia.com/gpu: 1 (NVIDIA T4 필요)
# 배포 단계: Phase 2 (g4dn 쿼타 승인 후) - make deploy-gpu
#
# ✏️  배포 전 필수 수정:
#   image 필드의 <AWS_ACCOUNT_ID>를 실제 AWS 계정 ID로 교체
#   예) 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/stain-detection-api:latest
#   명령: sed -i 's/<AWS_ACCOUNT_ID>/123456789012/g' k8s/*.yaml
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stain-detection
  namespace: microlens
  labels:
    app: stain-detection
spec:
  # 초기 replica는 1로 시작. HPA(05-hpa.yaml)가 트래픽에 따라 자동으로 증감시킨다.
  replicas: 1
  selector:
    matchLabels:
      app: stain-detection
  template:
    metadata:
      labels:
        app: stain-detection
    spec:
      # 00-serviceaccount.yaml에서 생성한 SA 사용.
      # Worker Node IAM Role을 통해 S3/ECR 접근 권한을 상속받는다.
      serviceAccountName: microlens-sa
      containers:
        - name: stain-detection
          # aws_account_id: Ansible 06-deploy-k8s.yml이 aws sts get-caller-identity로 자동 주입
          image: {{ aws_account_id }}.dkr.ecr.ap-northeast-2.amazonaws.com/stain-detection-api:latest
          # Always: 같은 태그(latest)라도 항상 최신 이미지를 pull.
          # Jenkins CI/CD에서 latest 태그로 푸시하므로 반드시 Always로 설정해야
          # 새 빌드가 배포에 반영된다.
          imagePullPolicy: Always
          ports:
            - containerPort: 8000  # FastAPI/uvicorn 기본 포트
          env:
            # Pod 내부에서 boto3 등 AWS SDK가 S3에서 모델 가중치를 다운로드할 때 사용
            - name: MODEL_BUCKET
              value: "microlens-model-weights"
            - name: AWS_REGION
              value: "ap-northeast-2"
            # S3 내 모델 파일 경로. 실제 업로드된 경로와 일치해야 한다.
            - name: MODEL_KEY
              value: "models/stain-detection/weights.pt"
          resources:
            requests:
              # requests: 스케줄러가 이 Pod를 배치할 노드를 선택할 때 기준이 되는 값.
              # GPU requests를 명시해야 nvidia-device-plugin이 GPU를 이 Pod에 예약한다.
              cpu: "500m"
              memory: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              # limits: 이 값을 초과하면 컨테이너가 강제 종료(OOMKilled).
              # GPU limits도 requests와 동일하게 1로 설정해야 독점 할당된다.
              # GPU는 CPU/메모리와 달리 공유가 불가능하므로 requests=limits=1이 표준.
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
          # livenessProbe: Pod가 살아있는지 주기적으로 확인.
          # 실패 시(failureThreshold 초과) Pod를 재시작한다.
          # initialDelaySeconds: GPU 모델 로딩 시간을 고려해 30초 여유를 준다.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          # readinessProbe: Pod가 트래픽을 받을 준비가 됐는지 확인.
          # 실패 시 Service의 엔드포인트 목록에서 제거되어 트래픽이 오지 않는다.
          # liveness보다 짧게 설정하여 준비된 Pod에만 트래픽이 흐르도록 한다.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
      # nodeSelector: node-type=gpu 라벨이 있는 GPU 노드(g4dn.xlarge)에만 배치된다.
      nodeSelector:
        node-type: gpu
      # tolerations: GPU 노드의 Taint(dedicated=gpu:NoSchedule)를 허용한다.
      # 이 Toleration이 없는 Pod(시스템 Pod, stain-classification)는
      # GPU 노드에 스케줄되지 않아 CPU 워커 노드로 자연스럽게 분리된다.
      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu
          effect: NoSchedule
---
# ============================================================
# Service (ClusterIP)
# 목적: Deployment의 Pod들을 클러스터 내부에서 단일 DNS 이름으로 접근 가능하게 함
#
# ClusterIP를 사용하는 이유:
#   외부에서 직접 접근하지 않고 Nginx Ingress Controller를 통해서만 접근한다.
#   Ingress → Service(ClusterIP) → Pod 순서로 트래픽이 흐른다.
#   Service는 Pod IP가 바뀌어도 안정적인 접근점을 제공하고,
#   여러 replica가 있을 때 로드밸런싱도 자동으로 처리한다.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: stain-detection-svc
  namespace: microlens
spec:
  selector:
    app: stain-detection  # 이 레이블을 가진 Pod들로 트래픽을 분산
  ports:
    - protocol: TCP
      port: 80         # Service가 노출하는 포트 (Ingress에서 이 포트로 접근)
      targetPort: 8000 # Pod의 실제 포트로 포워딩
  type: ClusterIP
