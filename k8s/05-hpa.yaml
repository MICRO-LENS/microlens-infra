# ============================================================
# 파일: 05-hpa.yaml
# 목적: 트래픽 증가 시 Pod를 자동으로 증감시키는 오토스케일러 설정
# 리소스: HorizontalPodAutoscaler × 3
#
# 전제 조건:
#   05-addons.yml에서 Metrics Server가 설치되어 있어야 한다.
#   Metrics Server가 없으면 HPA가 CPU 사용량을 수집하지 못해
#   "unable to get metrics" 오류가 발생하고 스케일링이 동작하지 않는다.
#
# 동작 원리:
#   Metrics Server가 각 Pod의 CPU 사용량을 수집하고,
#   HPA Controller가 averageUtilization(70%)을 기준으로
#   현재 필요한 replica 수를 계산하여 Deployment를 업데이트한다.
#
#   예) stain-detection Pod 1개가 CPU 140% 사용 중
#       → 목표: 70% 이하 유지
#       → 필요 replica = ceil(140 / 70) = 2개로 스케일 아웃
#
# HPA가 CPU를 계산하려면 Deployment의 resources.requests.cpu가
# 반드시 설정되어 있어야 한다. (01~03 파일에 모두 설정되어 있음)
#
# GPU 서비스(stain-detection, teeth)의 스케일 아웃 주의사항:
#   maxReplicas: 5로 설정되어 있으나 Worker Node가 2대이고
#   각 노드에 GPU가 1개씩이므로 실제로는 GPU Pod를 최대 2개만 동시 실행 가능.
#   GPU 부족 시 추가 Pod는 Pending 상태가 되며, 이는 정상 동작이다.
#   (향후 Worker Node 추가 시 자동으로 해소됨)
# ============================================================

# ── stain-detection HPA ────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stain-detection-hpa
  namespace: microlens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stain-detection  # 01-stain-detection.yaml의 Deployment 이름과 일치해야 함
  minReplicas: 1   # 트래픽이 없어도 최소 1개는 유지 (Cold Start 방지)
  maxReplicas: 5   # GPU 노드 수보다 많이 설정해도 GPU 부족 시 Pending으로 대기
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # 전체 Pod의 평균 CPU가 requests의 70% 초과 시 스케일 아웃
---
# ── stain-classification HPA ───────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stain-classification-hpa
  namespace: microlens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stain-classification
  minReplicas: 1
  maxReplicas: 5
  # CPU 전용 서비스이므로 Worker Node 수에 제약 없이 maxReplicas까지 스케일 가능
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# ── teeth HPA ──────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: teeth-hpa
  namespace: microlens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: teeth
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
