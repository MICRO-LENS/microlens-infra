# ============================================================
# 파일: 00-namespace.yaml
# 목적: MicroLens 전용 네임스페이스 생성
#
# 네임스페이스를 사용하는 이유:
#   K8s 클러스터는 여러 팀/서비스가 공유하는 경우가 많다.
#   네임스페이스로 MicroLens 리소스를 논리적으로 격리하면
#   kubectl 명령 시 -n microlens 로 범위를 한정할 수 있고,
#   다른 네임스페이스의 리소스와 이름 충돌을 방지한다.
#
# 적용 순서: 가장 먼저 적용해야 한다.
#   이후 모든 리소스(Deployment, Service 등)가 이 네임스페이스를 참조하므로
#   네임스페이스가 없으면 나머지 파일 적용 시 오류가 발생한다.
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: microlens
  labels:
    app.kubernetes.io/part-of: microlens
