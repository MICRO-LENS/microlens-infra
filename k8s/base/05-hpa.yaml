# Phase 1 (CPU only) 에서 유효한 HPA
# stain-detection / teeth HPA 는 overlays/phase2/05-hpa-gpu.yaml 에 위치
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stain-classification-hpa
  namespace: microlens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stain-classification
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
