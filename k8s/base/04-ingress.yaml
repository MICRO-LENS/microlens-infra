# ============================================================
# 파일: 04-ingress.yaml
# 목적: 외부 트래픽을 경로(Path) 기준으로 각 서비스에 라우팅
# 리소스: Ingress
#
# 전제 조건: 05-addons.yml에서 Nginx Ingress Controller가 설치되어 있어야 한다.
#
# 트래픽 흐름:
#   Android 앱 → NAT 공인 IP:NodePort
#     → Nginx Ingress Controller Pod
#       → /stain/detect   → stain-detection-svc  → stain-detection Pod
#       → /stain/classify → stain-classification-svc → stain-classification Pod
#       → /teeth/check    → teeth-svc             → teeth Pod
#
# rewrite-target 동작 원리:
#   클라이언트는 /stain/detect, /stain/classify, /teeth/check 로 요청하고
#   각 백엔드 Pod는 /predict 로 받는다. (prefix → /predict 고정 리라이트)
#   이렇게 하면 각 서비스의 API 코드가 /stain/detect 같은
#   인프라 경로 구조를 알 필요가 없어 서비스 독립성이 보장된다.
#
# host 값 주입 방식:
#   Ansible 06-deploy-k8s.yml이 template 모듈로 이 파일을 렌더링할 때
#   nat_ip = hostvars['bastion']['ansible_host'] (hosts.ini의 NAT 퍼블릭 IP)를 자동 주입
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microlens-ingress
  namespace: microlens
  annotations:
    # rewrite-target: AI API 경로 prefix를 /predict 로 고정 리라이트
    # 예) /stain/detect → /predict, /stain/classify → /predict
    # 주의: 이 어노테이션은 Ingress 전체에 적용되므로 클라이언트 라우팅은
    #       rewrite 없는 별도 Ingress(06-client.yaml)에서 처리한다
    nginx.ingress.kubernetes.io/rewrite-target: /predict
    # AI 추론은 응답 시간이 길 수 있으므로 타임아웃을 300초로 설정
    # 기본값(60초)으로 두면 추론 중 타임아웃 오류가 발생할 수 있다
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # 이미지 파일 업로드를 고려해 요청 body 크기 제한을 50MB로 완화
    # 기본값은 1MB로, 이미지 업로드 시 413 오류가 발생한다
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  # Nginx Ingress Controller가 이 Ingress를 처리하도록 지정
  # 05-addons.yml에서 설치한 컨트롤러의 ingressClassName과 일치해야 한다
  ingressClassName: nginx
  rules:
    - host: microlens.cloud
      http:
        paths:
          # 얼룩 탐지 API: /stain/detect → stain-detection-svc:/predict
          - path: /stain/detect
            pathType: Prefix
            backend:
              service:
                name: stain-detection-svc
                port:
                  number: 80
          # 얼룩 분류 API: /stain/classify → stain-classification-svc:/predict
          - path: /stain/classify
            pathType: Prefix
            backend:
              service:
                name: stain-classification-svc
                port:
                  number: 80
          # 치아 분석 API: /teeth/check → teeth-svc:/predict
          - path: /teeth/check
            pathType: Prefix
            backend:
              service:
                name: teeth-svc
                port:
                  number: 80
