# GPU 서비스 HPA (Phase 2 전용)
# base/05-hpa.yaml의 stain-classification HPA와 함께 적용됨
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stain-detection-hpa
  namespace: microlens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stain-detection
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: teeth-hpa
  namespace: microlens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: teeth
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
